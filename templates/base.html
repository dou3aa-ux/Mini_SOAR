<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Mini IDS{% endblock %}</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">Mini IDS</a>
        <span class="status"><span class="status-dot"></span> Local dashboard</span>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
